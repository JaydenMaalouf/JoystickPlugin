name: version
description: 'Sets the version information.'

inputs:
  prerelease:
    default: 'false'
    description: 'Indicates if this is a prerelease version.'

runs:
  using: 'composite'
  steps:
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.7.0
      with:
        versionSpec: '6.8.x'
    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4.7.0
    - name: Inject Version
      run: |
        $json = Get-Content 'JoystickPlugin.uplugin' -raw | ConvertFrom-Json
        $json.VersionName = "${{ steps.gitversion.outputs.semVer }}"
        $json.IsBetaVersion = $${{ inputs.prerelease }}
        $json | ConvertTo-Json -depth 32 | Set-Content 'JoystickPlugin.uplugin'
      shell: powershell
