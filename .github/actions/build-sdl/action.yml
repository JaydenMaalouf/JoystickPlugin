name: build-sdl
description: 'Builds SDL3 and stages the plugin ThirdParty SDL3 folder.'

inputs:
  platform:
    description: 'The SDL target platform to build: Win64, Mac, or Linux.'
    required: true
  sdlVersion:
    description: 'The SDL version to download and build.'
    default: '3.4.8'
  outputDirectory:
    description: 'Directory where Source/ThirdParty/SDL3 will be staged.'
    required: true
  includeHeaders:
    description: 'Whether to copy the SDL include directory into the staged artifact.'
    default: 'false'

runs:
  using: composite
  steps:
    - name: Download SDL3 source
      shell: pwsh
      run: |
        $sdlVersion     = '${{ inputs.sdlVersion }}'
        $runnerTemp     = $env:RUNNER_TEMP
        $sourceUrl      = "https://github.com/libsdl-org/SDL/archive/refs/tags/release-$sdlVersion.zip"
        $archivePath    = Join-Path $runnerTemp "SDL3-$sdlVersion.zip"
        $extractRoot    = Join-Path $runnerTemp 'SDL3-source'
        $sourceRoot     = Join-Path $extractRoot "SDL-release-$sdlVersion"
        $thirdPartyDir  = Join-Path '${{ inputs.outputDirectory }}' 'Source/ThirdParty/SDL3'

        Remove-Item -Path $extractRoot -Recurse -Force -ErrorAction SilentlyContinue
        New-Item -Path $extractRoot -ItemType Directory -Force | Out-Null
        New-Item -Path $thirdPartyDir -ItemType Directory -Force | Out-Null

        Invoke-WebRequest -Uri $sourceUrl -OutFile $archivePath
        Expand-Archive -Path $archivePath -DestinationPath $extractRoot -Force

        if (-not (Test-Path $sourceRoot)) {
          throw "SDL source folder not found: $sourceRoot"
        }

        "SDL_SOURCE_DIR=$sourceRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
        "SDL_OUTPUT_DIR=${{ inputs.outputDirectory }}" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Stage SDL3 headers
      if: inputs.includeHeaders
      shell: pwsh
      run: |
        $sourceRoot    = $env:SDL_SOURCE_DIR
        $thirdPartyDir = Join-Path '${{ inputs.outputDirectory }}' 'Source/ThirdParty/SDL3'

        Remove-Item -Path (Join-Path $thirdPartyDir 'include') -Recurse -Force -ErrorAction SilentlyContinue
        Copy-Item -Path (Join-Path $sourceRoot 'include') -Destination $thirdPartyDir -Recurse -Force

    - name: Build SDL3 for Mac
      if: inputs.platform == 'Mac'
      shell: bash
      run: |
        set -euo pipefail

        cd "$SDL_SOURCE_DIR"
        rm -rf build
        mkdir build
        cd build

        cmake .. \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
          -DCMAKE_BUILD_TYPE=Release \
          -DSDL_TESTS=OFF \
          -DSDL_EXAMPLES=OFF

        make -j$(sysctl -n hw.ncpu)

        mkdir -p "$SDL_OUTPUT_DIR/Source/ThirdParty/SDL3/Mac"
        cp libSDL3.0.dylib "$SDL_OUTPUT_DIR/Source/ThirdParty/SDL3/Mac/"

    - name: Build SDL3 for Win64
      if: inputs.platform == 'Win64'
      shell: pwsh
      run: |
        $sourceRoot = $env:SDL_SOURCE_DIR
        $outputDir  = Join-Path $env:SDL_OUTPUT_DIR 'Source/ThirdParty/SDL3/Win64'
        $buildDir   = Join-Path $sourceRoot 'build'

        Remove-Item -Path $buildDir -Recurse -Force -ErrorAction SilentlyContinue
        New-Item -Path $buildDir -ItemType Directory -Force | Out-Null
        New-Item -Path $outputDir -ItemType Directory -Force | Out-Null

        cmake -S $sourceRoot -B $buildDir -A x64 `
          -DSDL_TESTS=OFF `
          -DSDL_EXAMPLES=OFF
        cmake --build $buildDir --config Release --parallel

        Copy-Item -Path (Join-Path $buildDir 'Release/SDL3.dll') -Destination $outputDir -Force
        Copy-Item -Path (Join-Path $buildDir 'Release/SDL3.lib') -Destination $outputDir -Force

    - name: Build SDL3 for Linux
      if: inputs.platform == 'Linux'
      shell: bash
      run: |
        set -euo pipefail

        cd "$SDL_SOURCE_DIR"
        rm -rf build
        mkdir build
        cd build

        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
          -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-Bsymbolic" \
          -DSDL_UNIX_CONSOLE_BUILD=ON \
          -DSDL_SHARED=ON \
          -DSDL_STATIC=OFF \
          -DSDL_TESTS=OFF \
          -DSDL_EXAMPLES=OFF
        make -j$(nproc)

        mkdir -p "$SDL_OUTPUT_DIR/Source/ThirdParty/SDL3/Linux"
        SDL_REAL_LIBRARY="$(readlink -f libSDL3.so)"
        install -Dm755 "$SDL_REAL_LIBRARY" "$SDL_OUTPUT_DIR/Source/ThirdParty/SDL3/Linux/libSDL3.so.0"
