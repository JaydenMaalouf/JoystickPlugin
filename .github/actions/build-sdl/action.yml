name: build-sdl
description: 'Builds SDL3 with a JSP_ symbol prefix and JoystickSDL3 library identity, then stages the plugin ThirdParty SDL3 folder.'

# Why the rename: UE 5.7+ statically links its own copy of SDL3 into several
# engine modules (ApplicationCore, InputCore, Slate, ...). Those modules'
# SDL_x symbols end up exported with default visibility regardless of how we
# build our own copy, so if our SDL3 also exported plain SDL_x names, the two
# would collide process-wide. To avoid that, every public SDL function is
# renamed SDL_x -> JSP_SDL_x, and the library itself is renamed to
# JoystickSDL3, so nothing this action ships can ever be mistaken for the
# engine's own SDL.
#
# Pipeline: download pristine SDL source -> generate a JSP_ rename header
# from SDL's own symbol table (scripts/generate-prefix-header.sh) -> patch
# dynapi/version-script so the rename actually takes effect
# (scripts/patch-dynapi.sh) -> build via the overlay/ CMake project, which
# renames the output library -> verify no stock SDL_x symbol leaked out
# (scripts/verify-exports.*) -> stage into ThirdParty/SDL3.

inputs:
  platform:
    description: 'The SDL target platform to build: Win64, Mac, or Linux.'
    required: true
  sdlVersion:
    description: 'The SDL version to download and build.'
    default: '3.4.8'
  outputDirectory:
    description: 'Directory where Source/ThirdParty/SDL3 will be staged.'
    required: true
  includeHeaders:
    description: 'Whether to copy the SDL include directory into the staged artifact.'
    default: 'false'

runs:
  using: composite
  steps:
    - name: Download SDL3 source
      shell: pwsh
      run: |
        $sdlVersion     = '${{ inputs.sdlVersion }}'
        $runnerTemp     = $env:RUNNER_TEMP
        $sourceUrl      = "https://github.com/libsdl-org/SDL/archive/refs/tags/release-$sdlVersion.zip"
        $archivePath    = Join-Path $runnerTemp "SDL3-$sdlVersion.zip"
        $extractRoot    = Join-Path $runnerTemp 'SDL3-source'
        $sourceRoot     = Join-Path $extractRoot "SDL-release-$sdlVersion"
        $thirdPartyDir  = Join-Path '${{ inputs.outputDirectory }}' 'Source/ThirdParty/SDL3'

        Remove-Item -Path $extractRoot -Recurse -Force -ErrorAction SilentlyContinue
        New-Item -Path $extractRoot -ItemType Directory -Force | Out-Null
        New-Item -Path $thirdPartyDir -ItemType Directory -Force | Out-Null

        Invoke-WebRequest -Uri $sourceUrl -OutFile $archivePath
        Expand-Archive -Path $archivePath -DestinationPath $extractRoot -Force

        if (-not (Test-Path $sourceRoot)) {
          throw "SDL source folder not found: $sourceRoot"
        }

        "SDL_SOURCE_DIR=$sourceRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
        "SDL_OUTPUT_DIR=${{ inputs.outputDirectory }}" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Generate symbol prefix header
      shell: bash
      run: bash "${{ github.action_path }}/scripts/generate-prefix-header.sh" "${{ inputs.sdlVersion }}"

    - name: Patch SDL source for prefixed build
      shell: bash
      run: bash "${{ github.action_path }}/scripts/patch-dynapi.sh"

    - name: Stage SDL3 headers
      if: inputs.includeHeaders
      shell: pwsh
      run: |
        $sourceRoot    = $env:SDL_SOURCE_DIR
        $thirdPartyDir = Join-Path '${{ inputs.outputDirectory }}' 'Source/ThirdParty/SDL3'

        Remove-Item -Path (Join-Path $thirdPartyDir 'include') -Recurse -Force -ErrorAction SilentlyContinue
        Copy-Item -Path (Join-Path $sourceRoot 'include') -Destination $thirdPartyDir -Recurse -Force
        Copy-Item -Path $env:SDL_PREFIX_HEADER -Destination (Join-Path $thirdPartyDir 'include') -Force

    - name: Build SDL3 for Mac
      if: inputs.platform == 'Mac'
      shell: bash
      run: |
        set -euo pipefail

        BUILD_DIR="$RUNNER_TEMP/sdl-build"
        rm -rf "$BUILD_DIR"

        cmake -S "${{ github.action_path }}/overlay" -B "$BUILD_DIR" \
          -DSDL_ACTUAL_SOURCE_DIR="$SDL_SOURCE_DIR" \
          -DSDL_PREFIX_HEADER="$SDL_PREFIX_HEADER" \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
          -DCMAKE_BUILD_TYPE=Release \
          -DSDL_SHARED=ON \
          -DSDL_STATIC=OFF \
          -DSDL_TESTS=OFF \
          -DSDL_TEST_LIBRARY=OFF \
          -DSDL_EXAMPLES=OFF \
          -DSDL_AUDIO=OFF \
          -DSDL_VIDEO=OFF \
          -DSDL_POWER=OFF \
          -DSDL_SENSOR=OFF \
          -DSDL_DIALOG=OFF \
          -DSDL_TRAY=OFF
        cmake --build "$BUILD_DIR" --parallel "$(sysctl -n hw.ncpu)"

        DYLIB="$BUILD_DIR/SDL3-build/libJoystickSDL3.0.dylib"
        bash "${{ github.action_path }}/scripts/verify-exports.sh" "$DYLIB" "_" -gU

        mkdir -p "$SDL_OUTPUT_DIR/Source/ThirdParty/SDL3/Mac"
        cp "$DYLIB" "$SDL_OUTPUT_DIR/Source/ThirdParty/SDL3/Mac/"

    - name: Build SDL3 for Win64
      if: inputs.platform == 'Win64'
      shell: pwsh
      run: |
        $sourceRoot = $env:SDL_SOURCE_DIR
        $outputDir  = Join-Path $env:SDL_OUTPUT_DIR 'Source/ThirdParty/SDL3/Win64'
        $buildDir   = Join-Path $env:RUNNER_TEMP 'sdl-build'

        Remove-Item -Path $buildDir -Recurse -Force -ErrorAction SilentlyContinue
        New-Item -Path $outputDir -ItemType Directory -Force | Out-Null

        cmake -S "${{ github.action_path }}/overlay" -B $buildDir -A x64 `
          -DSDL_ACTUAL_SOURCE_DIR="$sourceRoot" `
          -DSDL_PREFIX_HEADER="$env:SDL_PREFIX_HEADER" `
          -DSDL_SHARED=ON `
          -DSDL_STATIC=OFF `
          -DSDL_TESTS=OFF `
          -DSDL_TEST_LIBRARY=OFF `
          -DSDL_EXAMPLES=OFF `
          -DSDL_AUDIO=OFF `
          -DSDL_VIDEO=OFF `
          -DSDL_POWER=OFF `
          -DSDL_SENSOR=OFF `
          -DSDL_DIALOG=OFF `
          -DSDL_TRAY=OFF
        cmake --build $buildDir --config Release --parallel

        $dllPath = Join-Path $buildDir 'SDL3-build/Release/JoystickSDL3.dll'
        $libPath = Join-Path $buildDir 'SDL3-build/Release/JoystickSDL3.lib'

        & "${{ github.action_path }}/scripts/verify-exports.ps1" -DllPath $dllPath

        Copy-Item -Path $dllPath -Destination $outputDir -Force
        Copy-Item -Path $libPath -Destination $outputDir -Force

    - name: Build SDL3 for Linux
      if: inputs.platform == 'Linux'
      shell: bash
      run: |
        set -euo pipefail

        BUILD_DIR="$RUNNER_TEMP/sdl-build"
        rm -rf "$BUILD_DIR"

        cmake -S "${{ github.action_path }}/overlay" -B "$BUILD_DIR" \
          -DSDL_ACTUAL_SOURCE_DIR="$SDL_SOURCE_DIR" \
          -DSDL_PREFIX_HEADER="$SDL_PREFIX_HEADER" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-Bsymbolic" \
          -DSDL_UNIX_CONSOLE_BUILD=ON \
          -DSDL_SHARED=ON \
          -DSDL_STATIC=OFF \
          -DSDL_TESTS=OFF \
          -DSDL_TEST_LIBRARY=OFF \
          -DSDL_EXAMPLES=OFF \
          -DSDL_AUDIO=OFF \
          -DSDL_VIDEO=OFF \
          -DSDL_POWER=OFF \
          -DSDL_SENSOR=OFF \
          -DSDL_DIALOG=OFF \
          -DSDL_TRAY=OFF
        cmake --build "$BUILD_DIR" --parallel "$(nproc)"

        SDL_REAL_LIBRARY="$(readlink -f "$BUILD_DIR/SDL3-build/libJoystickSDL3.so")"
        bash "${{ github.action_path }}/scripts/verify-exports.sh" "$SDL_REAL_LIBRARY" "" -D --defined-only

        # Sanity: soname must carry the renamed, unversioned identity.
        readelf -d "$SDL_REAL_LIBRARY" | grep -q 'Library soname: \[libJoystickSDL3.so\]' || {
          echo "ERROR: unexpected soname:" >&2
          readelf -d "$SDL_REAL_LIBRARY" | grep soname >&2
          exit 1
        }

        install -Dm755 "$SDL_REAL_LIBRARY" "$SDL_OUTPUT_DIR/Source/ThirdParty/SDL3/Linux/libJoystickSDL3.so"
