name: Build SDL3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/actions/build-sdl/**'
      - '.github/workflows/build-sdl.yml'
  workflow_call:
    inputs:
      signingRequired:
        description: 'Fail instead of skipping Mac signing when no certificate is provided.'
        type: boolean
        default: false
      retentionDays:
        description: 'Days to keep the SDL3 artifacts. 0 uses the repository default.'
        type: number
        default: 0

jobs:
  build-sdl:
    name: Build SDL3 - ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Win64
            runner: windows-latest
            includeHeaders: true
          - platform: Mac
            runner: macos-latest
            includeHeaders: false
          - platform: Linux
            runner: ubuntu-latest
            includeHeaders: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build SDL3
        uses: ./.github/actions/build-sdl
        with:
          platform: ${{ matrix.platform }}
          sdlVersion: '3.4.8'
          outputDirectory: ${{ runner.temp }}/sdl3-${{ matrix.platform }}
          includeHeaders: ${{ matrix.includeHeaders }}
      - name: Sign SDL3 for Mac
        if: matrix.platform == 'Mac'
        uses: ./.github/actions/sign-mac
        with:
          binary: ${{ runner.temp }}/sdl3-Mac/Source/ThirdParty/SDL3/Mac/libJoystickSDL3.0.dylib
          required: ${{ inputs.signingRequired || false }}
          certificate: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          certificatePassword: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          notaryKey: ${{ secrets.MAC_NOTARY_KEY_P8_BASE64 }}
          notaryKeyId: ${{ secrets.MAC_NOTARY_KEY_ID }}
          notaryIssuerId: ${{ secrets.MAC_NOTARY_ISSUER_ID }}
      - name: Upload SDL3 artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdl3-${{ matrix.platform }}
          path: ${{ runner.temp }}/sdl3-${{ matrix.platform }}/Source/ThirdParty/SDL3
          if-no-files-found: error
          retention-days: ${{ inputs.retentionDays || 0 }}
