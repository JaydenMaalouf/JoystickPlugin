name: Release Plugin 🚀

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'LICENSE'
    branches:
      - master

jobs:
  build-sdl:
    uses: ./.github/workflows/build-sdl.yml
    secrets: inherit
    with:
      signingRequired: true
      # Only needed to hand the libraries to the release job; don't leave them downloadable.
      retentionDays: 1

  release-plugin:
    runs-on: [self-hosted, Windows]
    needs: build-sdl
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Versioning
        uses: ./.github/actions/version
        with:
          prerelease: ${{ github.ref != 'refs/heads/master' }}
      - name: Download SDL3 artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sdl3-*
          path: ${{ runner.temp }}/sdl3-artifacts
      - name: Copy SDL3 artifacts to plugin
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'sdl3-artifacts'
          $targetDir    = Join-Path '${{ github.workspace }}' 'Source/ThirdParty/SDL3'

          New-Item -Path $targetDir -ItemType Directory -Force | Out-Null

          Get-ChildItem -Path $artifactRoot -Directory | ForEach-Object {
            Copy-Item -Path (Join-Path $_.FullName '*') -Destination $targetDir -Recurse -Force
          }
      - name: Package Plugin - 5.4
        uses: ./.github/actions/package
        with:
          engineVersion: '5.4'
          releaseVersion: ${{ env.GitVersion_SemVer }}
          launcherDirectory: ${{ secrets.LAUNCHER_DIRECTORY }}
          controllerDbUrl: ${{ vars.CONTROLLERDB_URL }}
      - name: Package Plugin - 5.5
        uses: ./.github/actions/package
        with:
          engineVersion: '5.5'
          releaseVersion: ${{ env.GitVersion_SemVer }}
          launcherDirectory: ${{ secrets.LAUNCHER_DIRECTORY }}
          controllerDbUrl: ${{ vars.CONTROLLERDB_URL }}
      - name: Package Plugin - 5.6
        uses: ./.github/actions/package
        with:
          engineVersion: '5.6'
          releaseVersion: ${{ env.GitVersion_SemVer }}
          launcherDirectory: ${{ secrets.LAUNCHER_DIRECTORY }}
          controllerDbUrl: ${{ vars.CONTROLLERDB_URL }}
      - name: Package Plugin - 5.7
        uses: ./.github/actions/package
        with:
          engineVersion: '5.7'
          releaseVersion: ${{ env.GitVersion_SemVer }}
          launcherDirectory: ${{ secrets.LAUNCHER_DIRECTORY }}
          controllerDbUrl: ${{ vars.CONTROLLERDB_URL }}
      - name: Package Plugin - 5.8
        uses: ./.github/actions/package
        with:
          engineVersion: '5.8'
          releaseVersion: ${{ env.GitVersion_SemVer }}
          launcherDirectory: ${{ secrets.LAUNCHER_DIRECTORY }}
          controllerDbUrl: ${{ vars.CONTROLLERDB_URL }}
      - name: Package Plugin for Fab
        uses: ./.github/actions/package-fab
        with:
          releaseVersion: ${{ env.GitVersion_SemVer }}
          outputDirectory: ${{ vars.FAB_OUTPUT_DIRECTORY }}
      - name: Create Release
        uses: ncipollo/release-action@v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          artifacts: '${{ runner.temp }}/output/*.zip'
          tag: ${{ env.GitVersion_SemVer }}
          commit: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/master' }}
