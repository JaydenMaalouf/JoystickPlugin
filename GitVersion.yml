workflow: TrunkBased/preview1
branches:
  main:
    increment: Minor
  develop:
    regex: ^dev(elop)?(ment)?$
    mode: ManualDeployment
    label: beta
    increment: Minor
    source-branches:
      - main
  release:
    regex: ^releases?[\/-](?<BranchName>.+)
    mode: ManualDeployment
    label: rc
    increment: None
    is-release-branch: true
    source-branches:
      - main
      - develop
  feature:
    mode: ContinuousDelivery
    label: alpha
  hotfix:
    label: ''
